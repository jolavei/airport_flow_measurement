<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medición de Flujos AERODROMOS.IGS</title>
    <style>
        :root {
            --primary-dark: #123456;
            --primary-mid: #345678;
            --primary-light: #56789A;
            --accent-green: #27ae60;
            --accent-red: #c0392b;
            --background: #fdfdfe;
            --text-dark: #0A1B2E;
            --text-light: #fefefe;
        }

        body {
            font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #fff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(18, 52, 86, 0.15);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(18, 52, 86, 0.05);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo-placeholder { max-width: 200px; margin: 0 auto 10px auto; display: flex; justify-content: center; }
        .logo-placeholder img { width: 100%; height: auto; object-fit: contain; }
        .header small { color: var(--primary-light); text-transform: uppercase; letter-spacing: 1px; font-size: 0.7rem; font-weight: 600; }

        .setup-area { background: #f8fbfd; border: 2px dashed #d9e2eb; border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 2.8rem; font-weight: bold; text-align: center; margin: 15px 0; color: var(--primary-dark); }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .metric-box { background: #fff; padding: 12px; border-radius: 10px; border: 1px solid #d9e2eb; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .metric-box span { font-size: 0.7rem; text-transform: uppercase; color: var(--primary-light); display: block; margin-bottom: 4px; }
        .metric-box strong { font-size: 1.6rem; color: var(--primary-dark); }

        .controls { display: flex; gap: 15px; margin-bottom: 15px; }
        .btn { border: none; border-radius: 12px; color: white; cursor: pointer; font-weight: 700; transition: all 0.2s; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn:disabled { background: #cbd5e0 !important; cursor: not-allowed; box-shadow: none; opacity: 0.6; }
        .btn-in { background: var(--accent-green); flex: 1; padding: 30px 10px; }
        .btn-out { background: var(--accent-red); flex: 1; padding: 30px 10px; }
        
        .btn-action { width: 100%; padding: 18px; margin-top: 10px; font-size: 1rem; }
        .start { background: var(--primary-mid); }
        .stop { background: var(--primary-dark); }
        .reset { background: #95a5a6; }

        input[type="number"] { width: 70px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1.2rem; text-align: center; }

        #results { background: var(--primary-dark); color: var(--text-light); padding: 18px; border-radius: 12px; margin-top: 15px; display: none; font-size: 0.95rem; }
        #downloadBtn, #newSessionBtn { display: none; margin-top: 12px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="logo-placeholder">
            <img src="logo aigs.png" alt="Logo AERODROMOS.IGS">
        </div>
        <small>Sistema de Medición de Flujos</small>
    </div>

    <div id="setup-area" class="setup-area">
        <label style="display:block; margin-bottom:12px; font-weight:600; color:var(--primary-dark);">Fila Actual (Pasajeros):</label>
        <div style="display:flex; justify-content:center; align-items:center; gap:12px;">
            <input type="number" id="initialCountInput" value="0" min="0">
        </div>
    </div>

    <div class="timer-display" id="timer">00:00:00</div>

    <div class="metrics-grid">
        <div class="metric-box" style="border-bottom: 3px solid var(--primary-light);">
            <span>En Fila</span>
            <strong id="current-queue">0</strong>
        </div>
        <div class="metric-box">
            <span>Entraron</span>
            <strong id="total-in">0</strong>
        </div>
        <div class="metric-box">
            <span>Salieron</span>
            <strong id="total-out">0</strong>
        </div>
    </div>

    <div class="controls">
        <button id="btnIn" class="btn btn-in" onclick="register('INGRESO')" disabled>📥<br>ENTRA</button>
        <button id="btnOut" class="btn btn-out" onclick="register('SALIDA')" disabled>📤<br>SALE</button>
    </div>

    <button id="sessionBtn" class="btn btn-action start" onclick="toggleSession()">INICIAR MEDICIÓN</button>
    
    <div id="results">
        <strong style="color:var(--primary-light);">KPIs del Levantamiento:</strong><br><br>
        <span id="resultsData"></span>
    </div>

    <button id="downloadBtn" class="btn btn-action stop" onclick="exportCSV()">💾 DESCARGAR REPORTE (.CSV)</button>
    <button id="newSessionBtn" class="btn btn-action reset" onclick="newSession()">🔄 NUEVO LEVANTAMIENTO</button>
</div>

<script>
    // Detector de errores para avisarte si algo se rompe
    window.onerror = function(msg, url, lineNo) {
        alert("Detectamos un error en el código. Línea: " + lineNo + "\nDetalle: " + msg);
        return false;
    };

    let sessionActive = false;
    let startTime, endTime;
    let timerInterval;
    let logs = [];
    let initialCount = 0;
    let countIn = 0;
    let countOut = 0;
    let finalKpis = {};

    function toggleSession() {
        const sBtn = document.getElementById('sessionBtn');
        const setupArea = document.getElementById('setup-area');
        
        if (!sessionActive) {
            // INICIO
            let inputVal = document.getElementById('initialCountInput').value;
            initialCount = parseInt(inputVal) || 0;
            sessionActive = true;
            startTime = new Date();
            
            logs.push({ 
                timestamp: startTime.toLocaleTimeString(), 
                event: "INICIO_SESION", 
                queue: initialCount,
                note: "Carga inicial: " + initialCount 
            });

            setupArea.style.opacity = "0.5";
            document.getElementById('initialCountInput').disabled = true;
            document.getElementById('current-queue').innerText = initialCount;
            sBtn.innerText = "FINALIZAR MEDICIÓN";
            sBtn.className = "btn btn-action stop";
            document.getElementById('btnIn').disabled = false;
            document.getElementById('btnOut').disabled = false;
            startTimer();
        } else {
            // FIN
            sessionActive = false;
            endTime = new Date();
            clearInterval(timerInterval);
            sBtn.style.display = "none";
            document.getElementById('btnIn').disabled = true;
            document.getElementById('btnOut').disabled = true;
            document.getElementById('downloadBtn').style.display = "block";
            document.getElementById('newSessionBtn').style.display = "block";
            document.getElementById('results').style.display = "block";
            processFinalMetrics();
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            let diff = Date.now() - startTime.getTime();
            let h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            let m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            let s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('timer').innerText = h + ':' + m + ':' + s;
        }, 1000);
    }

    function register(type) {
        if (type === 'INGRESO') countIn++;
        if (type === 'SALIDA') {
            if ((initialCount + countIn - countOut) <= 0) {
                alert("La fila ya está vacía, no puedes sacar a más personas.");
                return;
            }
            countOut++;
        }

        let currentQueue = initialCount + countIn - countOut;
        document.getElementById('total-in').innerText = countIn;
        document.getElementById('total-out').innerText = countOut;
        document.getElementById('current-queue').innerText = currentQueue;

        logs.push({
            timestamp: new Date().toLocaleTimeString(),
            event: type,
            queue: currentQueue,
            note: ""
        });
    }

    function processFinalMetrics() {
        let durationMin = (endTime.getTime() - startTime.getTime()) / 60000;
        let arrivalRate = countIn / durationMin;
        let departureRate = countOut / durationMin;
        
        let sumQueue = 0;
        for(let i=0; i<logs.length; i++){
            sumQueue += logs[i].queue;
        }
        let avgQueue = sumQueue / logs.length;
        let estimatedWait = arrivalRate > 0 ? (avgQueue / arrivalRate) : 0;

        finalKpis = {
            duration: durationMin,
            initialLoad: initialCount,
            arrivalRate: arrivalRate,
            departureRate: departureRate,
            avgWait: estimatedWait
        };

        document.getElementById('resultsData').innerHTML = 
            "• Duración: " + durationMin.toFixed(2) + " min<br>" +
            "• Carga Inicial: " + initialCount + " pax<br>" +
            "• Tasa de Entrada: " + arrivalRate.toFixed(2) + " pax/min<br>" +
            "• Tasa de Salida: " + departureRate.toFixed(2) + " pax/min<br>" +
            "<strong>TIEMPO PROM. EN FILA: " + estimatedWait.toFixed(2) + " min</strong>";
    }

    function exportCSV() {
        let csv = "AERODROMOS.IGS - REPORTE DE LEVANTAMIENTO\n";
        csv += "Fecha," + new Date().toLocaleDateString() + "\n\n";
        csv += "KPIs DE LA MEDICION\n";
        csv += "KPI,Valor\n";
        csv += "Duración de la medición (min)," + finalKpis.duration.toFixed(2) + "\n";
        csv += "Carga inicial de pasajeros en fila," + finalKpis.initialLoad + "\n";
        csv += "Tasa de entrada (pax/min)," + finalKpis.arrivalRate.toFixed(3) + "\n";
        csv += "Tasa de salida (pax/min)," + finalKpis.departureRate.toFixed(3) + "\n";
        csv += "Tiempo promedio en fila (min)," + finalKpis.avgWait.toFixed(2) + "\n\n";

        csv += "DETALLE LOG (SEGUNDO A SEGUNDO)\n";
        csv += "Timestamp,Evento,Personas_en_Fila,Notas\n";
        
        for(let i=0; i<logs.length; i++){
            csv += logs[i].timestamp + "," + logs[i].event + "," + logs[i].queue + ",\"" + logs[i].note + "\"\n";
        }
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'Levantamiento_AERODROMOS_' + new Date().toISOString().slice(0,10) + '.csv');
        a.click();
    }

    function newSession() {
        if(confirm("¿Estás seguro de reiniciar? Todos los datos no descargados se perderán.")){
            logs = [];
            initialCount = 0;
            countIn = 0;
            countOut = 0;
            finalKpis = {};

            document.getElementById('timer').innerText = "00:00:00";
            document.getElementById('current-queue').innerText = "0";
            document.getElementById('total-in').innerText = "0";
            document.getElementById('total-out').innerText = "0";
            document.getElementById('results').style.display = "none";
            document.getElementById('downloadBtn').style.display = "none";
            document.getElementById('newSessionBtn').style.display = "none";
            
            const sBtn = document.getElementById('sessionBtn');
            const setupArea = document.getElementById('setup-area');
            setupArea.style.opacity = "1";
            document.getElementById('initialCountInput').disabled = false;
            document.getElementById('initialCountInput').value = 0;
            sBtn.style.display = "block";
            sBtn.innerText = "INICIAR MEDICIÓN";
            sBtn.className = "btn btn-action start";
        }
    }
</script>

</body>
</html>
